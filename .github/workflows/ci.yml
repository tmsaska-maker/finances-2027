name: Validate app and financial domain
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test financial domain
        run: npm test
      - name: Type-check financial domain
        run: npm run typecheck:domain
      - name: Type-check React application
        run: npm run typecheck
      - name: Test private API validators and auth gate
        run: node --test server/validation.test.mjs server/http.test.mjs
      - name: Test authenticated finance gateway
        run: node --test gateway/gateway.test.mjs
      - name: Verify finance-only deployment isolation
        run: node --test deploy/compose.test.mjs
      - name: Check Docker Compose syntax with dummy CI secrets
        run: |
          FINANCES_DB_PASSWORD=ci-placeholder-not-a-secret FINANCES_API_TOKEN=ci-placeholder-not-a-secret FINANCES_GATEWAY_KEY=ci-other-placeholder-not-a-secret docker compose -f deploy/compose.yaml config -q
      - name: Production build
        run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finances_ci
          POSTGRES_PASSWORD: only_for_ephemeral_ci
          POSTGRES_DB: finances_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finances_ci -d finances_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FINANCES_TEST_DATABASE_URL: postgresql://finances_ci:only_for_ephemeral_ci@localhost:5432/finances_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated server dependencies
        run: npm install --prefix server --no-audit --no-fund --ignore-scripts
      - name: Run real PostgreSQL integration tests
        run: node --test server/integration.test.mjs
