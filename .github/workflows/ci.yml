name: Validate app and financial domain
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Save dependency lockfile once
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build: lock frontend dependencies for repeatable CI'
            git push origin HEAD:main
          fi
      - name: Test financial domain
        run: npm test
      - name: Type-check financial domain
        run: npm run typecheck:domain
      - name: Type-check React application
        run: npm run typecheck
      - name: Production build
        run: npm run build
