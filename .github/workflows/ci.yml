name: Validate app and financial domain
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test financial domain
        run: npm test
      - name: Type-check financial domain
        run: npm run typecheck:domain
      - name: Type-check React application
        run: npm run typecheck
      - name: Test private API validators and auth gate
        run: |
          node --test server/validation.test.mjs server/http.test.mjs
          timeout 45s node --test --test-reporter=spec server/browser-gateway.test.mjs
      - name: Verify finance-only deployment isolation
        run: node --test deploy/compose.test.mjs
      - name: Verify manual finance deploy safety guards
        run: node --test deploy/manual-finance-deploy.test.mjs
      - name: Validate isolated Docker synthetic finance gateway integration contract
        run: node --test deploy/gateway-smoke.test.mjs
      - name: Check Docker Compose syntax with dummy CI secrets
        run: |
          FINANCES_DB_PASSWORD=ci-placeholder-not-a-secret FINANCES_API_TOKEN=ci-placeholder-not-a-secret docker compose -f deploy/compose.yaml config -q
      - name: Check gateway release fail-closed evidence and isolated Compose diff
        run: node --test deploy/gateway-release-gate.test.mjs deploy/gateway-compose-diff-gate.test.mjs
      - name: Validate gated real finance gateway snapshot with no-start restore check
        run: node --test deploy/finance-gateway-rollback-snapshot.test.mjs
      - name: Synthetic Docker end-to-end gateway and finance API smoke (NO DEPLOY)
        run: |
          set -euo pipefail
          docker build -f server/Dockerfile.gateway -t "finances2027-gateway-candidate:${GITHUB_SHA}" server
          bash deploy/gateway-docker-smoke.sh "finances2027-gateway-candidate:${GITHUB_SHA}"
      - name: Rehearse old-new-old gateway rollback in isolated synthetic Docker network
        run: |
          set -euo pipefail
          node --test deploy/gateway-rollback-rehearsal.test.mjs
          bash deploy/gateway-rollback-rehearsal.sh "finances2027-gateway-candidate:${GITHUB_SHA}"
      - name: Production build
        run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finances_ci
          POSTGRES_PASSWORD: only_for_ephemeral_ci
          POSTGRES_DB: finances_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finances_ci -d finances_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FINANCES_TEST_DATABASE_URL: postgresql://finances_ci:only_for_ephemeral_ci@localhost:5432/finances_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated server dependencies
        run: npm install --prefix server --no-audit --no-fund --ignore-scripts
      - name: Run real PostgreSQL integration tests
        run: node --test server/integration.test.mjs
