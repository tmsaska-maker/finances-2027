name: Validate app and financial domain
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test financial domain
        run: npm test
      - name: Type-check financial domain
        run: npm run typecheck:domain
      - name: Type-check React application
        run: npm run typecheck
      - name: Production build
        run: npm run build
