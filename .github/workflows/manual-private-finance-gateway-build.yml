name: T007 finance gateway candidate - package only (NO DEPLOY)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test finance gateway session and authorization contract
        run: timeout 60s node --test --test-reporter=spec server/browser-gateway.test.mjs
      - name: Build standalone finance gateway container on runner only
        run: |
          set -euo pipefail
          docker build -f server/Dockerfile.gateway -t "finances2027-gateway-candidate:${GITHUB_SHA}" server
      - name: Verify container entrypoint without running a gateway or using real secrets
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint node "finances2027-gateway-candidate:${GITHUB_SHA}" --check browser-gateway-main.mjs
      - name: Synthetic Docker network gateway to private API end-to-end smoke
        run: |
          set -euo pipefail
          bash -n deploy/gateway-docker-smoke.sh
          bash deploy/gateway-docker-smoke.sh "finances2027-gateway-candidate:${GITHUB_SHA}"
      - name: Archive candidate image for later security review — NO server upload
        run: |
          set -euo pipefail
          docker save "finances2027-gateway-candidate:${GITHUB_SHA}" | gzip -1 > "finances2027-gateway-candidate-${GITHUB_SHA}.tar.gz"
          sha256sum "finances2027-gateway-candidate-${GITHUB_SHA}.tar.gz" > gateway-image.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: finances2027-gateway-candidate
          path: |
            finances2027-gateway-candidate-*.tar.gz
            gateway-image.sha256
          retention-days: 3
