name: Build Finances 2027 for Lightsail
on:
  push:
    branches: [main]
    paths:
      - "finances2027-figma-ui.zip"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore approved Figma UI
        run: |
          test -s finances2027-figma-ui.zip
          unzip -o -q finances2027-figma-ui.zip src/App.tsx src/index.css
          test -s src/App.tsx
          test -s src/index.css
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build UI
        run: npm run build
      - name: Pack static website
        run: tar -czf finances2027-dist.tar.gz -C dist .
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: finances2027-dist
          path: finances2027-dist.tar.gz
          retention-days: 30
