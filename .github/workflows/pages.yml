name: Build Finances 2027 for Lightsail
on:
  push:
    branches: [main]
    paths:
      - "finances2027-figma-ui.zip"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore approved Figma UI
        run: |
          if [ ! -s src/App.tsx ] || [ ! -s src/index.css ]; then
            test -s finances2027-figma-ui.zip
            unzip -o -q finances2027-figma-ui.zip src/App.tsx src/index.css
          fi
          test -s src/App.tsx
          test -s src/index.css
      - name: Commit approved Figma sources to main once
        run: |
          if ! git ls-files --error-unmatch src/App.tsx src/index.css >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/App.tsx src/index.css
            git commit -m "feat: track approved Figma source files directly"
            git push origin HEAD:main
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build UI
        run: npm run build
      - name: Pack static website
        run: tar -czf finances2027-dist.tar.gz -C dist .
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: finances2027-dist
          path: finances2027-dist.tar.gz
          retention-days: 30
      - name: Publish static site branch for Lightsail
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: site
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'deploy: Figma 2027 static site'
